<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestionează rezervarea | Curățenia Perfectă</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f6b4c">
<link rel="icon" href="assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container nav">
    <a href="index.html" class="brand"><img src="assets/img/logo.png" alt="Curățenia Perfectă"> Curățenia Perfectă</a>
    <nav>
      <ul class="nav-links">
        <li><a href="index.html" data-page="index.html">Acasă</a></li>
        <li><a href="servicii.html" data-page="servicii.html">Servicii</a></li>
        <li><a href="despre-noi.html" data-page="despre-noi.html">Despre noi</a></li>
        <li><a href="contact.html" data-page="contact.html">Contact</a></li>
      </ul>
    </nav>
    <div class="nav-cta">
      <a href="tel:0726712535" class="nav-phone">0726 712 535</a>
      <a href="contact.html" class="btn btn-primary">Cere ofertă</a>
      <button class="nav-toggle" aria-label="Deschide meniul" aria-expanded="false"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>

<main>
  <section class="section-tight" style="padding-top:56px;">
    <div class="container" style="max-width:640px;">
      <span class="eyebrow">Rezervarea ta</span>
      <h1>Gestionează cererea ta</h1>

      <div id="manage-loading" class="card">
        <div class="skeleton" style="height:20px;width:60%;margin-bottom:12px;"></div>
        <div class="skeleton" style="height:14px;width:90%;margin-bottom:8px;"></div>
        <div class="skeleton" style="height:14px;width:80%;"></div>
      </div>

      <div id="manage-error" class="card" style="display:none;border-color:#f2cfcb;"></div>

      <div id="manage-card" class="card" style="display:none;">
        <span id="m-status" class="badge"></span>
        <h3 style="margin-top:14px;" id="m-name"></h3>
        <table style="width:100%;border-collapse:collapse;margin-top:10px;font-size:0.95rem;">
          <tr><td style="padding:6px 0;color:var(--ink-soft);width:40%;">Serviciu</td><td id="m-service" style="padding:6px 0;"></td></tr>
          <tr><td style="padding:6px 0;color:var(--ink-soft);">Zonă</td><td id="m-zone" style="padding:6px 0;"></td></tr>
          <tr><td style="padding:6px 0;color:var(--ink-soft);">Data dorită</td><td id="m-date" style="padding:6px 0;"></td></tr>
          <tr><td style="padding:6px 0;color:var(--ink-soft);vertical-align:top;">Detalii</td><td id="m-details" style="padding:6px 0;"></td></tr>
          <tr><td style="padding:6px 0;color:var(--ink-soft);">Trimisă la</td><td id="m-created" style="padding:6px 0;"></td></tr>
        </table>
        <div id="m-note-wrap" style="display:none;margin-top:14px;padding:14px;background:#fbeceb;border-radius:8px;">
          <strong>Notă:</strong> <span id="m-note"></span>
        </div>
        <div style="margin-top:24px;display:flex;gap:12px;flex-wrap:wrap;">
          <button id="m-cancel" class="btn btn-ghost" style="display:none;border-color:var(--danger);color:var(--danger);">Anulează cererea</button>
          <a href="contact.html" class="btn btn-ghost">Trimite o cerere nouă</a>
        </div>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container footer-bottom" style="border-top:none;margin-top:0;">
    <span>© <span id="year"></span> Curățenia Perfectă</span>
    <span><a href="mailto:office@curateniaperfecta.ro">office@curateniaperfecta.ro</a></span>
  </div>
</footer>

<script src="assets/js/main.js"></script>
<script type="module" src="assets/js/manage.js"></script>
</body>
</html>
