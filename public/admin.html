<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | Curățenia Perfectă</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f6b4c">
<link rel="icon" href="assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .admin-tabs { display:flex; gap:8px; margin: 20px 0; flex-wrap:wrap; }
  .admin-tab { font-family: var(--font-mono); font-size:0.8rem; padding:8px 14px; border-radius:999px; border:1px solid var(--line); background:#fff; cursor:pointer; }
  .admin-tab.active { background: var(--accent); color:#fff; border-color: var(--accent); }
</style>
</head>
<body>

<header class="site-header">
  <div class="container nav">
    <a href="index.html" class="brand"><img src="assets/img/logo.png" alt="Curățenia Perfectă"> Curățenia Perfectă</a>
    <span class="eyebrow" style="margin:0;">Panou admin</span>
  </div>
</header>

<main>
  <div id="admin-gate" class="gate">
    <div class="card">
      <h3>Acces admin</h3>
      <p>Conectează-te cu contul Google autorizat pentru a vedea cererile de curățenie.</p>
      <p id="admin-denied" class="muted" style="display:none;color:var(--danger);"></p>
      <button id="admin-login" class="btn btn-primary btn-block">Conectează-te cu Google</button>
    </div>
  </div>

  <div id="admin-panel" style="display:none;">
    <section class="section-tight">
      <div class="container">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">
          <div>
            <span class="eyebrow">Cereri de curățenie</span>
            <h1 style="margin-bottom:0;">Panou admin</h1>
          </div>
          <div style="text-align:right;">
            <p class="muted" style="margin-bottom:6px;" id="admin-who"></p>
            <button id="admin-logout" class="btn btn-ghost">Deconectare</button>
          </div>
        </div>

        <div class="admin-tabs">
          <button class="admin-tab active" data-filter="pending">În așteptare</button>
          <button class="admin-tab" data-filter="confirmed">Confirmate</button>
          <button class="admin-tab" data-filter="declined">Refuzate</button>
          <button class="admin-tab" data-filter="cancelled">Anulate</button>
          <button class="admin-tab" data-filter="all">Toate</button>
        </div>

        <div class="table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Trimisă la</th>
                <th>Client</th>
                <th>Serviciu</th>
                <th>Zonă</th>
                <th>Data dorită</th>
                <th>Status</th>
                <th>Acțiuni</th>
              </tr>
            </thead>
            <tbody id="admin-rows"></tbody>
          </table>
          <p id="admin-empty" class="muted center" style="padding:24px;display:none;">Nicio cerere în această categorie.</p>
        </div>
      </div>
    </section>
  </div>
</main>

<script type="module" src="assets/js/admin.js"></script>
</body>
</html>
